name: Build Animey APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Recreate Android Gradle Setup
        run: |
          # 1. Force lowercase package name inside pubspec.yaml
          if [ -f pubspec.yaml ]; then
            sed -i 's/^name: .*/name: animey/' pubspec.yaml
          fi

          # 2. Remove incomplete android folder
          rm -rf android
          
          # 3. Explicitly pass lowercase project name to bypass repo casing
          flutter create . --project-name animey --org com.animey.app --platforms=android
          
          # 4. Inject streaming permissions and cleartext traffic
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: animey-apk
          path: build/app/outputs/flutter-apk/app-release.apk
