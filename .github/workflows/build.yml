name: Build Animey APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Scaffold Android Files Without Overwriting Project
        run: |
          # 1. Back up pubspec.yaml
          cp pubspec.yaml pubspec.yaml.bak

          # 2. Delete incomplete android directory
          rm -rf android

          # 3. Create fresh Android project in a separate temp directory
          flutter create --platforms=android --org com.animey.app --project-name animey temp_scaffold
          
          # 4. Copy ONLY the android folder into our project
          cp -r temp_scaffold/android ./android
          rm -rf temp_scaffold

          # 5. Restore original pubspec.yaml
          mv pubspec.yaml.bak pubspec.yaml
          sed -i 's/^name: .*/name: animey/' pubspec.yaml

          # 6. Inject video streaming network permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Check for Dart Code Errors
        run: flutter analyze

      - name: Build Android APK
        run: flutter build apk --release --verbose

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: animey-apk
          path: build/app/outputs/flutter-apk/app-release.apk
